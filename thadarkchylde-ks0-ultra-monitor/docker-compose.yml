services:

  app_proxy:
    environment:
      APP_HOST: ${APP_ID}_web_1
      APP_PORT: 3000

  web:
    build:
      context: ${APP_DATA_DIR}/app
    restart: on-failure
    stop_grace_period: 1m
    environment:
      KS_USER: admin
      KS_PASSWORD: "12345678"
      SCAN_SUBNET: "192.168.0.0/24"
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
